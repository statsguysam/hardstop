[project]
name = "hardstop-agent"
version = "0.2.0"
description = "A multi-app agent that produces verified presentation cuts from changing producer briefs."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hardstop = "hardstop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hardstop"]
py-modules = ["configure", "receive_credentials"]
