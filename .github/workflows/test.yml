name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python, media, OAuth, and review interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI uses isolated synthetic credentials; no provider secrets are required.
      HARDSTOP_CREDENTIALS_DIR: .state/ci-credentials
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node for syntax validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Require real media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v
      - name: Check review-interface JavaScript
        run: node --check web/app.js
